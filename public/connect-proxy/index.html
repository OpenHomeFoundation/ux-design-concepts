<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect Proxy · Devices – Home Assistant</title>
<meta name="description" content="The Home Assistant device page for the Connect Proxy, with an inline setup banner that adapts its copy as you configure each capability.">
<link rel="icon" href="ds/assets/home-assistant-logomark-color-on-light.svg">
<meta property="og:image" content="screenshots/connect-proxy-device.png">
<link rel="stylesheet" href="ds/colors_and_type.css">
<link rel="stylesheet" href="ds/fonts.css">
<style>
  /* Match the real Home Assistant default theme (demo.home-assistant.io) */
  :root { --primary-color: #03a9f4; --dark-primary-color: #0288d1; --link-text-color: #03a9f4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--ha-font-family-body);
    color: var(--primary-text-color);
    background: var(--primary-background-color);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* ===================== shared primitives (cards, buttons, chips) ===================== */
  .ha-card {
    background: var(--card-background-color);
    border-radius: var(--ha-card-border-radius);
    border: 1px solid var(--divider-color);
    box-shadow: none;
    color: var(--primary-text-color);
  }

  .ha-btn {
    font-family: inherit; font-size: 14px; font-weight: 500; letter-spacing: .0089em;
    text-transform: none; height: 40px; padding: 0 24px; border-radius: 20px; border: 0;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: background .15s ease, box-shadow .15s ease, color .15s ease, border-color .15s ease;
    white-space: nowrap;
  }
  .ha-btn--filled { background: var(--primary-color); color: #fff; }
  .ha-btn--filled:hover { background: #039be5; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .ha-btn--filled:active { background: #0288d1; }
  .ha-btn--outlined { background: transparent; color: var(--primary-color); border: 1px solid rgba(0,0,0,.18); padding: 0 23px; }
  .ha-btn--outlined:hover { background: rgba(3,169,244,.06); border-color: var(--primary-color); }
  .ha-btn--text { background: transparent; color: var(--primary-color); padding: 0 12px; }
  .ha-btn--text:hover { background: rgba(3,169,244,.08); }
  .ha-btn[disabled] { background: rgba(0,0,0,.06); color: rgba(0,0,0,.34); cursor: not-allowed; box-shadow: none; border-color: transparent; }
  .ha-btn--outlined[disabled] { background: transparent; border-color: rgba(0,0,0,.12); }
  .ha-btn--text[disabled] { background: transparent; }

  .icon-btn {
    width: 40px; height: 40px; border-radius: 999px; border: 0; background: transparent;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex: none;
    transition: background .15s ease;
  }
  .icon-btn:hover { background: rgba(0,0,0,.08); }

  .icon-chip { width: 40px; height: 40px; border-radius: 999px; flex: none; display: flex; align-items: center; justify-content: center; }

  .chip {
    display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px;
    font-size: 12px; font-weight: 500; letter-spacing: .01em; white-space: nowrap; line-height: 1;
  }
  .chip--info { background: rgba(2,136,209,.12); color: #0277bd; }
  .chip--success { background: rgba(67,160,71,.15); color: #2e7d32; }
  .chip--warning { background: rgba(255,152,0,.18); color: #b26a00; }
  .chip--neutral { background: rgba(0,0,0,.07); color: #5a5a5a; }

  .done-check { width: 24px; height: 24px; border-radius: 999px; background: var(--success-color); display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .done-check--warn { background: var(--warning-color); }

  /* ===================== app shell ===================== */
  .ha-app { display: flex; min-height: 100vh; background: var(--primary-background-color); }

  .sidebar {
    width: 256px; flex: none; align-self: stretch;
    border-right: 1px solid var(--divider-color); background: var(--card-background-color);
    display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
  }
  .sidebar__head { display: flex; align-items: center; gap: 14px; height: 56px; padding: 0 12px 0 8px; border-bottom: 1px solid var(--divider-color); }
  .sidebar__brand { font-size: 20px; font-weight: 400; }
  .sidebar__nav { padding: 12px 0 4px; display: flex; flex-direction: column; gap: 4px; }
  .sidebar__foot { margin-top: auto; padding: 4px 0 12px; display: flex; flex-direction: column; gap: 4px; }

  .nav__item {
    display: flex; align-items: center; gap: 22px; padding: 8px 12px 8px 8px; margin: 0 8px;
    border-radius: 10px; color: #141414; font-size: 14px; font-weight: 500; cursor: pointer;
    transition: background .15s;
  }
  .nav__item:hover { background: rgba(0,0,0,.05); border-radius: 4px; }
  .nav__item.is-active { color: #009ac7; background: #dff3fc; border-radius: 4px; }
  .nav__user { font-weight: 500; }
  .avatar {
    width: 30px; height: 30px; border-radius: 999px; flex: none; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 500; color: #21527a; background: #b3e5fc;
  }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .appbar {
    height: 56px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 12px;
    border-bottom: 1px solid var(--divider-color); background: var(--card-background-color);
    position: sticky; top: 0; z-index: 5;
  }
  .appbar__title { margin: 0 0 0 8px; font-size: 20px; font-weight: 400; line-height: 1; }
  .appbar__spacer { flex: 1; }

  .content { flex: 1; }
  .content-inner { max-width: 1000px; margin: 0 auto; padding: 20px 28px 56px; }
  .content-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; min-height: 48px; }
  .area-link { color: var(--primary-color); font-size: 14px; font-weight: 400; text-decoration: none; }
  .area-link:hover { text-decoration: underline; }
  .integration-logo { height: 30px; width: auto; object-fit: contain; display: block; }
  .esphome-lockup { display: flex; align-items: center; gap: 10px; }
  .esphome-lockup__name { font-size: 28px; font-weight: 600; letter-spacing: -.01em; }

  /* ===================== masonry ===================== */
  .masonry { display: flex; gap: 16px; align-items: flex-start; }
  .masonry__col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px; }

  /* ===================== device cards ===================== */
  .dcard { overflow: hidden; }
  .dcard__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 2px; }
  .dcard__title { margin: 0; font-size: 24px; font-weight: 400; line-height: 1.25; color: var(--primary-text-color); }
  .dcard__body { padding: 10px 20px 14px; }
  .dcard__foot { border-top: 1px solid var(--divider-color); padding: 4px 8px; }

  .linkbtn { color: var(--primary-color); font-size: 14px; font-weight: 500; text-decoration: none; padding: 11px 16px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px; }
  .linkbtn:hover { background: rgba(3,169,244,.08); }
  .linkbtn--inline { padding: 4px 0; }
  .linkbtn--inline:hover { background: transparent; text-decoration: underline; }

  /* device info */
  .dinfo { padding-top: 8px; }
  .dinfo p { margin: 0 0 14px; }
  .dinfo p:last-child { margin-bottom: 2px; }
  .dinfo__model { color: var(--secondary-text-color); font-size: 14px; line-height: 1.45; }
  .dinfo__line { font-size: 14px; line-height: 1.45; }
  .dinfo__mac { color: var(--primary-color); text-decoration: underline; }
  .dinfo__links { padding: 4px 12px 6px; margin-top: 2px; }
  .dinfo__row {
    width: 100%; display: flex; align-items: center; gap: 16px; padding: 10px 8px; min-height: 52px;
    background: transparent; border: 0; cursor: pointer; font-family: inherit; text-align: left; border-radius: 8px;
    transition: background .15s;
  }
  .dinfo__row:hover { background: rgba(0,0,0,.04); }
  .dinfo__row-name { flex: 1; min-width: 0; font-size: 16px; }
  .dinfo__action { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px; border-top: 1px solid var(--divider-color); }

  /* entity row */
  .erow { display: flex; align-items: center; gap: 16px; min-height: 40px; padding: 0; }
  .erow__icon { width: 40px; height: 40px; flex: none; display: flex; align-items: center; justify-content: flex-start; }
  .erow__text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .erow__name { font-size: 14px; font-weight: 400; line-height: 1.25; }
  .erow__sec { font-size: 13px; color: var(--secondary-text-color); margin-top: 1px; }
  .erow__value { font-size: 14px; color: var(--secondary-text-color); flex: none; }
  .erow__control { flex: none; }

  /* toggle */
  .ha-toggle {
    width: 36px; height: 20px; border-radius: 999px; border: 1px solid #b0b3b8; cursor: pointer; position: relative; padding: 0;
    background: #f2f3f5; flex: none; transition: background .2s cubic-bezier(.4,0,.2,1), border-color .2s cubic-bezier(.4,0,.2,1);
  }
  .ha-toggle__thumb {
    position: absolute; top: 50%; left: 2px; transform: translateY(-50%); width: 14px; height: 14px; border-radius: 999px; background: #5b6066;
    transition: transform .2s cubic-bezier(.4,0,.2,1), background .2s cubic-bezier(.4,0,.2,1);
  }
  .ha-toggle.is-on { background: #cbe8fb; border-color: var(--primary-color); }
  .ha-toggle.is-on .ha-toggle__thumb { transform: translate(16px, -50%); background: var(--primary-color); }

  /* related / activity */
  .dcard__head--related { padding-bottom: 6px; }
  .related__add {
    display: inline-flex; align-items: center; gap: 4px; height: 36px; padding: 0 14px 0 10px; border-radius: 999px;
    background: rgba(3,169,244,.12); color: var(--primary-color); border: 0; cursor: pointer; font-family: inherit;
    font-size: 14px; font-weight: 500; flex: none;
  }
  .related__add:hover { background: rgba(3,169,244,.2); }
  .related__empty { margin: 0; font-size: 14px; line-height: 1.5; color: var(--secondary-text-color); }
  .dcard--activity { min-height: 380px; display: flex; flex-direction: column; }
  .activity__body { flex: 1; display: flex; align-items: center; justify-content: center; }
  .activity__empty { color: var(--secondary-text-color); font-size: 15px; }

  /* ===================== "ready" banner ===================== */
  .proxy-banner { padding: 18px 20px; display: grid; grid-template-columns: minmax(0,1.05fr) minmax(0,1fr); gap: 22px 32px; align-items: center; margin-bottom: 16px; box-shadow: none; border: 1px solid var(--divider-color); }
  .entry-hero__brand { display: flex; align-items: center; gap: 10px; }
  .entry-hero__kicker { font-size: 12px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: var(--secondary-text-color); }
  .proxy-banner__title { margin: 0 0 8px; font-size: 24px; font-weight: 400; line-height: 1.25; }
  .proxy-banner__lead { margin: 0 0 20px; font-size: 14px; line-height: 1.5; color: var(--secondary-text-color); max-width: 48ch; }
  .entry-hero__actions { display: flex; align-items: center; gap: 8px; }
  .proxy-banner__pips { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 24px; }

  .pip { display: flex; align-items: center; gap: 12px; }
  .pip__chip { width: 40px; height: 40px; border-radius: 999px; flex: none; display: flex; align-items: center; justify-content: center; position: relative; }
  .pip__check { position: absolute; right: -2px; bottom: -2px; width: 16px; height: 16px; border-radius: 999px; background: var(--success-color); border: 2px solid var(--card-background-color); display: flex; align-items: center; justify-content: center; }
  .pip__label { font-size: 14px; font-weight: 500; line-height: 1.2; }
  .pip__tag { margin-left: 2px; transform: scale(.86); transform-origin: left center; }

  @media (max-width: 900px) {
    .proxy-banner { grid-template-columns: 1fr; gap: 22px; }
  }
  @media (max-width: 520px) {
    .proxy-banner__pips { grid-template-columns: 1fr; }
    .content-inner { padding: 16px 16px 48px; }
    .esphome-lockup__name { font-size: 24px; }
    .integration-logo { height: 32px; }
  }

  /* hide sidebar on narrow viewports */
  @media (max-width: 999px) { .sidebar { display: none; } }

  /* ===================== breakpoint preview (Viewport tweak) ===================== */
  /* "Fit" = no wrapper effect; the shell flows as normal and the real media
     queries above drive it. When a device width is chosen we frame the shell and
     drive its responsive states with [data-vp], since the media queries key off
     the browser window — not the constrained frame. */
  .vp-stage:not(.is-constrained) { display: contents; }
  .vp-stage.is-constrained {
    min-height: 100vh; background: #d9dde2;
    display: flex; flex-direction: column; align-items: center;
    gap: 14px; padding: 26px 20px 44px; overflow: auto;
  }
  .vp-stage.is-constrained .ha-app {
    min-height: calc(100vh - 96px); flex: none;
    border-radius: 16px; overflow: hidden;
    background: var(--primary-background-color);
    box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 30px 70px -24px rgba(0,0,0,.45);
    outline: 1px solid rgba(0,0,0,.08);
  }
  .vp-stage.is-constrained .sidebar { height: auto; position: relative; }
  .vp-badge {
    flex: none; order: -1;
    font: 500 12px/1 var(--ha-font-family-code, ui-monospace, monospace);
    letter-spacing: .05em; color: #4a4a4a;
    background: #fff; border: 1px solid rgba(0,0,0,.12);
    padding: 7px 14px; border-radius: 999px;
    box-shadow: 0 1px 2px rgba(0,0,0,.06);
  }

  /* class-driven equivalents of the viewport media queries */
  .ha-app[data-vp="tablet"] .sidebar,
  .ha-app[data-vp="mobile"] .sidebar { display: none; }
  .ha-app[data-vp="tablet"] .proxy-banner,
  .ha-app[data-vp="mobile"] .proxy-banner { grid-template-columns: 1fr; gap: 22px; }
  .ha-app[data-vp="mobile"] .proxy-banner__pips { grid-template-columns: 1fr; }
  .ha-app[data-vp="mobile"] .content-inner { padding: 16px 16px 48px; }
  .ha-app[data-vp="mobile"] .esphome-lockup__name { font-size: 24px; }
  .ha-app[data-vp="mobile"] .integration-logo { height: 32px; }

  /* ===================== dialog + flows (shared with the wizard) ===================== */
  .scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 24px; animation: fade .15s ease;
  }
  @keyframes fade { from { opacity: 0; } }
  .dialog {
    background: var(--card-background-color); border-radius: 28px; box-shadow: var(--ha-box-shadow-l);
    width: 100%; max-width: 560px; max-height: 88vh; display: flex; flex-direction: column; overflow: hidden;
    animation: pop .18s cubic-bezier(.4,0,.2,1);
  }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.99); } }
  .dialog__head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; flex: none; }
  .dialog__title { flex: 1; min-width: 0; margin: 0; font-size: 20px; font-weight: 500; line-height: 1.2; }
  .dialog__body { padding: 0 24px 20px; overflow-y: auto; flex: 1; }
  .dialog__intro { margin: 0 0 18px; font-size: 14px; line-height: 1.5; color: var(--secondary-text-color); }
  .dialog__foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 16px; flex: none; border-top: 1px solid var(--divider-color); }

  /* full-screen dialog on mobile */
  @media (max-width: 600px) {
    .scrim { padding: 0; }
    .dialog { max-width: none; width: 100%; height: 100vh; height: 100dvh; max-height: none; border-radius: 0; }
    .dialog__head { padding: 12px 8px; }
    .dialog__body { padding: 0 16px 20px; }
    .listitems { margin: 0 -16px; }
    .listitem { padding: 12px 16px; }
  }

  .checklist { display: flex; flex-direction: column; gap: 8px; }
  .checkitem { border: 1px solid var(--divider-color); border-radius: 8px; overflow: hidden; transition: border-color .15s, box-shadow .15s; }
  .checkitem.is-open { border-color: rgba(0,0,0,.2); }
  .checkitem.is-dismissed .checkitem__head { opacity: .62; }
  .checkitem__head { width: 100%; display: flex; align-items: center; gap: 14px; padding: 12px 14px; min-height: 64px; background: transparent; border: 0; cursor: pointer; text-align: left; font-family: inherit; transition: background .15s; }
  .checkitem__head:hover { background: rgba(0,0,0,.025); }
  .checkitem__text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .checkitem__title { font-size: 14px; font-weight: 400; line-height: 1.25; }
  .checkitem__short { font-size: 12px; color: var(--secondary-text-color); line-height: 1.3; }
  .checkitem__right { display: flex; align-items: center; gap: 10px; flex: none; }
  .checkitem__body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .22s cubic-bezier(.4,0,.2,1); }
  .checkitem__body-inner { overflow: hidden; min-height: 0; }
  .checkitem__desc { margin: 0; padding: 0 14px 0 68px; font-size: 14px; line-height: 1.45; color: var(--secondary-text-color); }
  .checkitem__hint { display: flex; gap: 10px; align-items: flex-start; margin: 12px 14px 0 68px; padding: 10px 12px; background: var(--ha-color-surface-2); border-radius: 8px; font-size: 13px; line-height: 1.4; color: var(--secondary-text-color); }
  .checkitem__hint svg { flex: none; margin-top: 1px; }
  .checkitem__actions { display: flex; align-items: center; gap: 6px; padding: 14px 14px 16px 68px; }

  /* ----- list-item variant (chevron-right rows that open a detail page) ----- */
  .listitems { display: flex; flex-direction: column; margin: 0 -24px; }
  .listitem {
    width: auto; display: flex; align-items: center; gap: 16px; padding: 12px 24px; min-height: 64px;
    background: transparent; border: 0; cursor: pointer; font-family: inherit; text-align: left;
    transition: background .15s;
  }
  .listitem + .listitem { border-top: 0; }
  .listitem:hover { background: rgba(0,0,0,.025); }
  .listitem.is-dismissed .listitem__text { opacity: .62; }
  .listitem__text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .listitem__title { font-size: 14px; font-weight: 400; line-height: 1.25; }
  .listitem__short { font-size: 12px; color: var(--secondary-text-color); line-height: 1.3; }
  .listitem__right { display: flex; align-items: center; gap: 10px; flex: none; }
  .status-text { font-size: 14px; color: var(--secondary-text-color); line-height: 1.2; }

  /* ----- detail page (drill-in from a list item) ----- */
  .detail { display: flex; flex-direction: column; gap: 18px; padding-top: 4px; }
  .detail__hero { display: flex; align-items: center; gap: 16px; }
  .detail__icon { width: 56px; height: 56px; border-radius: 16px; flex: none; display: flex; align-items: center; justify-content: center; }
  .detail__hero-text { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .detail__short { font-size: 14px; color: var(--secondary-text-color); line-height: 1.3; }
  .detail__status { display: flex; }
  .detail__status:empty { display: none; }
  .detail__desc { margin: 0; font-size: 15px; line-height: 1.55; color: var(--secondary-text-color); }
  .detail .flow-feature-list { margin: 0; }
  .detail .audio-players { margin: 0; }
  .detail__actions { display: flex; align-items: center; gap: 8px; padding-top: 2px; }

  .audio-players { display: flex; flex-direction: column; gap: 8px; margin: 12px 14px 16px 68px; }
  .audio-player { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1px solid var(--divider-color); border-radius: 12px; background: var(--card-background-color); }
  .audio-player__icon { flex: none; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
  .audio-player__text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .audio-player__name { font-size: 14px; font-weight: 500; color: var(--primary-text-color); }
  .audio-player__meta { font-size: 12.5px; color: var(--secondary-text-color); }
  .audio-player__end { margin-left: auto; flex: none; }

  /* "recommended" accent pill (distinct from the success-green done check) */
  .chip--recommend { background: rgba(83,194,43,.16); color: #2f7d12; }

  /* Music Assistant upsell card — the "there's a better option" hero inside the audio item */
  .ma-upsell { padding: 16px; border: 1px solid var(--divider-color); border-radius: 12px; background: var(--card-background-color); display: flex; flex-direction: column; gap: 14px; }
  .ma-upsell__head { display: flex; align-items: flex-start; gap: 12px; }
  .ma-upsell__title-wrap { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
  .ma-upsell__name { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; color: var(--primary-text-color); }
  .ma-upsell__benefits { display: flex; flex-direction: column; gap: 9px; }
  .ma-benefit { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--primary-text-color); }
  .ma-upsell .ha-btn { align-self: flex-start; }

  .flow-body { animation: stepin .2s ease; }
  @keyframes stepin { from { opacity: 0; transform: translateX(6px); } }
  .flow-intro { text-align: center; padding: 8px 8px 4px; }
  .flow-hero-chip { width: 64px; height: 64px; border-radius: 999px; margin: 8px auto 18px; display: flex; align-items: center; justify-content: center; }
  .flow-title { margin: 0 0 10px; font-size: 22px; font-weight: 500; line-height: 1.25; }
  .flow-title--sm { font-size: 18px; margin: 0 0 4px; }
  .flow-copy { font-size: 14px; line-height: 1.55; color: var(--secondary-text-color); }
  .flow-copy p { margin: 0 0 10px; }
  .flow-copy--sm { font-size: 13.5px; }
  .flow-form { display: flex; flex-direction: column; gap: 14px; }
  .flow-form > p { margin: 0; }
  .flow-note { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; background: var(--ha-color-surface-2); border-radius: 10px; font-size: 13px; line-height: 1.45; color: var(--secondary-text-color); }
  .flow-note svg { margin-top: 1px; flex: none; }
  .flow-link { color: var(--primary-color); font-weight: 500; text-decoration: none; }
  .flow-link:hover { text-decoration: underline; }

  .radio-list { display: flex; flex-direction: column; gap: 8px; }

  .radio-icon { flex: none; display: flex; }

  .picker-list { display: flex; flex-direction: column; }

  .search-field__input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 14px; color: var(--primary-text-color); }
  .search-field__input::placeholder { color: var(--secondary-text-color); }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field__label { font-size: 13px; font-weight: 500; color: var(--secondary-text-color); }
  .field__label:empty { display: none; }
  .field__input { font-family: inherit; font-size: 15px; height: 48px; padding: 0 14px; border-radius: 10px; border: 1px solid rgba(0,0,0,.22); background: var(--card-background-color); color: var(--primary-text-color); width: 100%; transition: border-color .15s, box-shadow .15s; }
  .field__input:focus { outline: 0; border-color: var(--primary-color); box-shadow: inset 0 0 0 1px var(--primary-color); }
  .field__input--mono { font-family: var(--ha-font-family-code); font-size: 13.5px; }
  .field__input.is-readonly { background: var(--ha-color-surface-2); color: var(--secondary-text-color); }
  .field__hint { font-size: 12.5px; color: var(--secondary-text-color); }
  .select-wrap { position: relative; }
  .select-wrap select { appearance: none; -webkit-appearance: none; cursor: pointer; }

  .flow-working { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 40px 0 36px; }
  .spinner { width: 44px; height: 44px; border-radius: 999px; border: 4px solid rgba(0,0,0,.1); border-top-color: var(--primary-color); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .flow-success .success-mark { width: 64px; height: 64px; border-radius: 999px; background: var(--success-color); margin: 8px auto 18px; display: flex; align-items: center; justify-content: center; animation: pop .25s cubic-bezier(.34,1.56,.64,1); }

  .twk-sect { text-transform: none !important; letter-spacing: .01em !important; font-size: 11.5px !important; }
