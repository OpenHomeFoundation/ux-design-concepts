<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prototype Viewer — Device Database</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="tokens.css">

  <style>
    /* Viewer chrome is intentionally NOT styled with the device-database
       design system — it's a developer surface (Chrome devtools-ish), not
       a product surface. Dark backdrop so the page inside reads as the
       subject of attention. */
    :root {
      --vw-bg:      #1f2126;
      --vw-bg-2:    #2a2d33;
      --vw-line:    #393d44;
      --vw-line-2:  #4a4f57;
      --vw-fg:      #e6e8ec;
      --vw-fg-muted:#9aa1ac;
      --vw-accent:  #0288d1; /* matches the design system's primary */
      --vw-accent-2:#03a9f4;
    }

    *,*::before,*::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--vw-bg);
      color: var(--vw-fg);
      font-family: var(--font-sans, 'Inter', system-ui, sans-serif);
      font-size: 13px;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Top toolbar ─────────────────────────────────────────────── */
    .vw-toolbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      background: var(--vw-bg-2);
      border-bottom: 1px solid var(--vw-line);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 16px;
      z-index: 10;
    }
    .vw-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 13px;
      color: var(--vw-fg);
      white-space: nowrap;
    }
    .vw-brand .vw-route {
      color: var(--vw-fg-muted);
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 12px;
      font-weight: 500;
    }
    .vw-divider {
      width: 1px;
      height: 24px;
      background: var(--vw-line);
      flex: 0 0 auto;
    }
    .vw-bp-group {
      display: flex;
      gap: 2px;
      background: var(--vw-bg);
      border: 1px solid var(--vw-line);
      border-radius: 8px;
      padding: 2px;
    }
    .vw-bp {
      appearance: none;
      background: transparent;
      border: 0;
      color: var(--vw-fg-muted);
      font: inherit;
      font-weight: 500;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 140ms ease, color 140ms ease;
      white-space: nowrap;
    }
    .vw-bp:hover { color: var(--vw-fg); }
    .vw-bp.active {
      background: var(--vw-accent);
      color: #fff;
    }
    .vw-bp .vw-bp-dim {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 11px;
      opacity: 0.75;
    }
    .vw-bp.active .vw-bp-dim { opacity: 0.95; }

    .vw-grow { flex: 1; }

    /* Dimensions readout / editor (top-right of toolbar). Mirrors the
       Chrome devtools responsive bar exactly: two numeric inputs joined
       by an "×". Click + type, or use the arrow keys, to set custom dims. */
    .vw-dim {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 12px;
      color: var(--vw-fg);
      background: var(--vw-bg);
      border: 1px solid var(--vw-line);
      border-radius: 8px;
      padding: 4px 8px;
    }
    .vw-dim input {
      width: 56px;
      background: transparent;
      border: 0;
      color: var(--vw-fg);
      font: inherit;
      text-align: center;
      padding: 2px 0;
      outline: 0;
    }
    .vw-dim input::-webkit-outer-spin-button,
    .vw-dim input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .vw-dim input[type=number] { -moz-appearance: textfield; }
    .vw-dim input:focus { color: var(--vw-accent-2); }
    .vw-dim .vw-x { color: var(--vw-fg-muted); }
    /* iOS focus-zoom guard: these chrome fields render at 12–13px, which
       makes mobile Safari zoom on focus. Force 16px on small screens only. */
    @media (max-width: 768px) {
      .vw-dim input, #zoom-select { font-size: 16px; }
    }
    .vw-dim-rotate {
      appearance: none;
      background: transparent;
      border: 0;
      color: var(--vw-fg-muted);
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
    }
    .vw-dim-rotate:hover { background: var(--vw-line); color: var(--vw-fg); }

    .vw-zoom {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--vw-bg);
      border: 1px solid var(--vw-line);
      border-radius: 8px;
      padding: 4px 6px;
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 12px;
      color: var(--vw-fg-muted);
    }
    .vw-zoom select {
      appearance: none;
      background: transparent;
      border: 0;
      color: var(--vw-fg);
      font: inherit;
      cursor: pointer;
      outline: 0;
      padding: 0 16px 0 4px;
      background-image: linear-gradient(45deg, transparent 50%, var(--vw-fg-muted) 50%),
                        linear-gradient(135deg, var(--vw-fg-muted) 50%, transparent 50%);
      background-position: calc(100% - 7px) center, calc(100% - 3px) center;
      background-size: 4px 4px;
      background-repeat: no-repeat;
    }

    /* ─── Stage (the area below the toolbar where the page lives) ─── */
    .vw-stage {
      position: fixed;
      top: 52px;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: auto;
      /* faint dotted grid backdrop, devtools-style */
      background:
        radial-gradient(circle at 1px 1px, rgba(255,255,255,0.045) 1px, transparent 0)
        0 0 / 24px 24px,
        var(--vw-bg);
    }
    .vw-stage-inner {
      /* Generous padding so the iframe + handles never crowd the edges,
         and so the bottom-right corner handle is always reachable even at
         the largest custom sizes (the stage scrolls if the inner overflows). */
      padding: 48px 64px 96px;
      width: max-content;
      min-width: 100%;
      min-height: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* The frame holding the iframe. Its own width/height come from inline
       style set by JS; CSS just paints the chrome (shadow, ruler-style
       border, handles). */
    .vw-frame {
      position: relative;
      background: #fff;
      box-shadow:
        0 0 0 1px var(--vw-line-2),
        0 30px 60px -20px rgba(0,0,0,0.55),
        0 8px 20px -8px rgba(0,0,0,0.4);
      flex: 0 0 auto;
      transition: width 120ms ease-out, height 120ms ease-out;
    }
    .vw-frame.dragging { transition: none; }
    .vw-frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #fff;
    }

    /* Resize handles — right edge, bottom edge, and bottom-right corner.
       Chrome devtools shows these as small light-blue chips you grab. */
    .vw-handle {
      position: absolute;
      background: var(--vw-accent);
      opacity: 0;
      transition: opacity 140ms ease;
      z-index: 2;
    }
    .vw-frame:hover .vw-handle,
    .vw-frame.dragging .vw-handle { opacity: 0.9; }
    .vw-handle.right {
      top: 50%;
      right: -3px;
      width: 6px;
      height: 56px;
      transform: translateY(-50%);
      border-radius: 3px;
      cursor: ew-resize;
    }
    .vw-handle.bottom {
      left: 50%;
      bottom: -3px;
      width: 56px;
      height: 6px;
      transform: translateX(-50%);
      border-radius: 3px;
      cursor: ns-resize;
    }
    .vw-handle.corner {
      right: -5px;
      bottom: -5px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      cursor: nwse-resize;
    }

    /* Floating live-size badge that pops up while dragging — exactly like
       the size tooltip Chrome devtools shows while you drag-resize. */
    .vw-size-badge {
      position: fixed;
      pointer-events: none;
      transform: translate(-50%, -100%) translateY(-12px);
      background: rgba(15,17,21,0.92);
      color: #fff;
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--vw-line-2);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      z-index: 50;
      opacity: 0;
      transition: opacity 100ms ease;
      white-space: nowrap;
    }
    .vw-size-badge.visible { opacity: 1; }

    /* Ruler marks on the frame edges — purely cosmetic; reinforce the
       "responsive design mode" metaphor. */
    .vw-ruler-x, .vw-ruler-y {
      position: absolute;
      color: var(--vw-fg-muted);
      font: 500 10px/1 var(--font-mono, 'JetBrains Mono', monospace);
      letter-spacing: 0.04em;
      pointer-events: none;
      user-select: none;
    }
    .vw-ruler-x {
      top: -22px;
      left: 0; right: 0;
      text-align: center;
    }
    .vw-ruler-y {
      left: -32px;
      top: 0; bottom: 0;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Generic round icon button (back arrow, rotate, etc.). Visible at
       rest \u2014 a quiet chip with border and muted glyph \u2014 then brightens
       on hover. (Previously transparent at rest, which made the back
       button invisible until you happened to mouse over it.) */
    .vw-iconbtn {
      appearance: none;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--vw-bg);
      border: 1px solid var(--vw-line);
      color: var(--vw-fg-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: background 140ms ease, color 140ms ease, border-color 140ms ease;
    }
    .vw-iconbtn svg { display: block; stroke: currentColor; }
    a.vw-iconbtn, a.vw-iconbtn:link, a.vw-iconbtn:visited { color: var(--vw-fg-muted); }
    a.vw-iconbtn:hover { color: var(--vw-fg); }
    .vw-iconbtn:hover {
      color: var(--vw-fg);
    }

    /* Small-screen guardrail. The viewer is built for wide displays — on a
       narrow window the handles + toolbar become unusable. We let it scroll
       horizontally rather than hide. */
    @media (max-width: 600px) {
      .vw-toolbar { gap: 8px; padding: 0 8px; }
      .vw-brand { display: none; }
    }
  </style>
</head>
<body>
  <!-- ─────────────────────────────────────────────────────────────────
       The viewer is small enough to write as plain HTML + a single
       script — no React. Keeps the surface fast and predictable. The
       script reads ?route, ?w, ?h, ?label from the URL, mounts an
       iframe, and wires up the resize/breakpoint controls. ────────── -->

  <div class="vw-toolbar" id="toolbar">
    <a class="vw-iconbtn" id="back-link" href="canvas.html" title="Back to overview" aria-label="Back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <div class="vw-divider"></div>

    <div class="vw-bp-group" id="bp-group" role="tablist" aria-label="Breakpoint"></div>

    <div class="vw-grow"></div>

    <div class="vw-dim" title="Custom viewport size">
      <input type="number" id="w-input" min="240" max="3200" step="1" inputmode="numeric" aria-label="Width">
      <span class="vw-x">×</span>
      <input type="number" id="h-input" min="320" max="3200" step="1" inputmode="numeric" aria-label="Height">
      <button class="vw-dim-rotate" id="rotate-btn" title="Rotate (swap width and height)" aria-label="Rotate">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
      </button>
    </div>

    <div class="vw-zoom" title="Stage zoom">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <select id="zoom-select" aria-label="Zoom">
        <option value="0.5">50%</option>
        <option value="0.75">75%</option>
        <option value="1" selected>100%</option>
        <option value="1.25">125%</option>
        <option value="1.5">150%</option>
      </select>
    </div>
  </div>

  <div class="vw-stage" id="stage">
    <div class="vw-stage-inner" id="stage-inner">
      <div class="vw-frame" id="frame">
        <div class="vw-ruler-x" id="ruler-x">0 px</div>
        <div class="vw-ruler-y" id="ruler-y">0 px</div>
        <iframe id="page-frame" title="Page preview" scrolling="yes"></iframe>
        <div class="vw-handle right" id="h-right" title="Drag to resize width"></div>
        <div class="vw-handle bottom" id="h-bottom" title="Drag to resize height"></div>
        <div class="vw-handle corner" id="h-corner" title="Drag to resize"></div>
      </div>
    </div>
  </div>

  <div class="vw-size-badge" id="size-badge"></div>

  <script>
    /* Back link is a plain relative href — same iframe, same origin,
       same auth context. No URL cloning needed; the Claude design UI
       treats the viewer as a sibling tab to the overview. */

    /* ─── Config (kept in sync with canvas.html) ───────────── */
    const BREAKPOINTS = [
      { id: 'mobile',  label: 'Mobile',  width: 390,  height: 780  },
      { id: 'tablet',  label: 'Tablet',  width: 820,  height: 1100 },
      { id: 'desktop', label: 'Desktop', width: 1200, height: 1100 },
      { id: 'wide',    label: 'Wide',    width: 1440, height: 1100 },
    ];
    const PAGE_NAMES = {
      '':                 'Home',
      'browse':           'Browse',
      'how-it-works':     'How it works',
      'editorial-stance': 'Editorial stance',
    };
    // Default for any other route (incl. device/<id>)
    function routeName(route) {
      if (PAGE_NAMES[route] !== undefined) return PAGE_NAMES[route];
      if (route.startsWith('device/')) return 'Device detail';
      return route || 'Home';
    }

    /* ─── State ──────────────────────────────────────────────────── */
    const params = new URLSearchParams(location.search);
    const initialRoute = params.get('route') || '';
    const state = {
      route:  initialRoute,
      width:  clamp(parseInt(params.get('w'), 10) || 1200, 240, 3200),
      height: clamp(parseInt(params.get('h'), 10) || 1100, 320, 3200),
      zoom:   1,
    };

    function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

    /* ─── DOM refs ───────────────────────────────────────────────── */
    const $frame    = document.getElementById('frame');
    const $iframe   = document.getElementById('page-frame');
    const $rulerX   = document.getElementById('ruler-x');
    const $rulerY   = document.getElementById('ruler-y');
    const $wInput   = document.getElementById('w-input');
    const $hInput   = document.getElementById('h-input');
    const $rotate   = document.getElementById('rotate-btn');
    const $bpGroup  = document.getElementById('bp-group');
    const $stage    = document.getElementById('stage');
    const $stageInner = document.getElementById('stage-inner');
    const $zoom     = document.getElementById('zoom-select');
    const $badge    = document.getElementById('size-badge');

    /* ─── Render: paint the toolbar pills, breadcrumb, and frame ─── */
    function buildBreakpointPills() {
      BREAKPOINTS.forEach((bp) => {
        const btn = document.createElement('button');
        btn.className = 'vw-bp';
        btn.dataset.bpId = bp.id;
        btn.type = 'button';
        btn.innerHTML = `<span>${bp.label}</span><span class="vw-bp-dim">${bp.width}</span>`;
        btn.title = `${bp.label} · ${bp.width} × ${bp.height}`;
        btn.addEventListener('click', () => {
          state.width  = bp.width;
          state.height = bp.height;
          render();
        });
        $bpGroup.appendChild(btn);
      });
    }
    buildBreakpointPills();

    function activeBreakpointId() {
      const match = BREAKPOINTS.find((bp) => bp.width === state.width && bp.height === state.height);
      return match ? match.id : null;
    }

    function render() {
      // Load the iframe lazily on first render and any time the route
      // changes (route is fixed for this viewer instance, so really just
      // first mount — but the guard keeps reloads cheap if we extend it
      // later).
      const url = 'index.html#/' + state.route;
      if ($iframe.getAttribute('data-route') !== state.route) {
        $iframe.src = url;
        $iframe.setAttribute('data-route', state.route);
      }
      document.title = `${routeName(state.route)} · ${state.width}×${state.height} — Viewer`;

      // Apply size + zoom. Zoom is implemented as a CSS transform on the
      // frame; the stage container scrolls to accommodate the scaled size.
      $frame.style.width  = state.width  + 'px';
      $frame.style.height = state.height + 'px';
      $frame.style.transformOrigin = 'top center';
      $frame.style.transform = state.zoom === 1 ? '' : `scale(${state.zoom})`;
      // Reserve space below the scaled frame so the stage scrollbar tracks
      // the *visual* (post-transform) footprint, not the unscaled layout
      // box. The inner's own padding (48 top + 96 bottom, border-box) plus
      // the scaled frame height is exactly what we need — no toolbar term
      // here because the stage container already starts below it
      // (top:52px), so its 100% min-height does not include the toolbar.
      $stageInner.style.minHeight =
        (48 + state.height * state.zoom + 96) + 'px';

      $rulerX.textContent = state.width + ' px';
      $rulerY.textContent = state.height + ' px';
      if (document.activeElement !== $wInput) $wInput.value = state.width;
      if (document.activeElement !== $hInput) $hInput.value = state.height;

      // Highlight the matching breakpoint pill (or none, if custom).
      const aid = activeBreakpointId();
      $bpGroup.querySelectorAll('.vw-bp').forEach((b) => {
        b.classList.toggle('active', b.dataset.bpId === aid);
      });
    }
    render();

    /* ─── Manual size inputs ─────────────────────────────────────── */
    function bindDimInput($el, key, min, max) {
      $el.addEventListener('input', () => {
        const v = parseInt($el.value, 10);
        if (!Number.isFinite(v)) return;
        state[key] = clamp(v, min, max);
        render();
      });
      // Restore the clamped value on blur if the user typed something
      // out of range (e.g. "9999") so the input doesn't lie.
      $el.addEventListener('blur', () => { $el.value = state[key]; });
    }
    bindDimInput($wInput, 'width',  240, 3200);
    bindDimInput($hInput, 'height', 320, 3200);

    $rotate.addEventListener('click', () => {
      const w = state.width;
      state.width  = state.height;
      state.height = w;
      render();
    });

    $zoom.addEventListener('change', () => {
      state.zoom = parseFloat($zoom.value) || 1;
      render();
    });

    /* ─── Drag-resize handles ────────────────────────────────────── */
    /* Each handle adjusts width, height, or both. While dragging we show
       a Chrome-devtools-style size badge that follows the cursor.

       The math accounts for the current zoom: dragging 100px on screen
       only adds (100 / zoom) virtual CSS pixels to the frame, so the
       relationship between gesture and reported size stays honest. */
    function attachDrag(el, axis) {
      el.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        el.setPointerCapture(e.pointerId);
        const startX = e.clientX, startY = e.clientY;
        const startW = state.width, startH = state.height;
        $frame.classList.add('dragging');

        const move = (ev) => {
          const dx = (ev.clientX - startX) / state.zoom;
          const dy = (ev.clientY - startY) / state.zoom;
          // The frame is centered, so growing it visually means growing
          // its right edge by `dx` AND its left edge by `dx` (the layout
          // re-centers automatically). Multiplying by 2 keeps the cursor
          // glued to the handle the user grabbed.
          if (axis.includes('x')) state.width  = clamp(Math.round(startW + dx * 2), 240, 3200);
          if (axis.includes('y')) state.height = clamp(Math.round(startH + dy),     320, 3200);
          render();
          showBadge(ev.clientX, ev.clientY);
        };
        const up = (ev) => {
          el.releasePointerCapture(e.pointerId);
          $frame.classList.remove('dragging');
          hideBadge();
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
        };
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      });
    }
    attachDrag(document.getElementById('h-right'),  'x');
    attachDrag(document.getElementById('h-bottom'), 'y');
    attachDrag(document.getElementById('h-corner'), 'xy');

    function showBadge(x, y) {
      $badge.textContent = state.width + ' × ' + state.height + ' px';
      $badge.style.left = x + 'px';
      $badge.style.top  = y + 'px';
      $badge.classList.add('visible');
    }
    function hideBadge() { $badge.classList.remove('visible'); }

    /* ─── Keyboard shortcuts ─────────────────────────────────────── */
    /*  ←/→/↑/↓ : nudge by 10px (Shift = 50px)
        1/2/3/4 : jump to mobile/tablet/desktop/wide
        R       : rotate
        Escape  : back to overview                                     */
    window.addEventListener('keydown', (e) => {
      const t = e.target;
      // Don't hijack arrow keys / numbers while typing in inputs
      if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.isContentEditable)) return;

      const step = e.shiftKey ? 50 : 10;
      let handled = true;
      switch (e.key) {
        case 'ArrowLeft':  state.width  = clamp(state.width  - step, 240, 3200); break;
        case 'ArrowRight': state.width  = clamp(state.width  + step, 240, 3200); break;
        case 'ArrowUp':    state.height = clamp(state.height - step, 320, 3200); break;
        case 'ArrowDown':  state.height = clamp(state.height + step, 320, 3200); break;
        case '1': case '2': case '3': case '4': {
          const bp = BREAKPOINTS[parseInt(e.key, 10) - 1];
          if (bp) { state.width = bp.width; state.height = bp.height; }
          break;
        }
        case 'r': case 'R': {
          const w = state.width; state.width = state.height; state.height = w; break;
        }
        case 'Escape': location.href = 'canvas.html'; break;
        default: handled = false;
      }
      if (handled) { e.preventDefault(); render(); }
    });
  </script>
</body>
</html>
