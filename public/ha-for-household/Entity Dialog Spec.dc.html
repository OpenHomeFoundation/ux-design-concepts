    const dialogPreview = h("div", { style: { width: 360, maxWidth: "100%" } }, this.galleryCard(lightSpec));
    const labelChip = (n, t) => h("div", { style: { display: "flex", gap: "var(--space-2)", alignItems: "flex-start", fontSize: "var(--text-sm)", color: "var(--color-text-secondary)", lineHeight: 1.5 } }, h("span", { style: { fontFamily: "var(--font-mono)", fontSize: "var(--text-xs)", color: "var(--color-accent)", flex: "none", marginTop: 2 } }, n), t);
    const anatomy = h("div", { style: { display: "flex", flexWrap: "wrap", gap: "var(--space-8)", alignItems: "flex-start" } },
      h("div", { style: { display: "flex", flexDirection: "column", gap: "var(--space-3)" } }, this.colHead("Desktop \u2265 768px \u00b7 centered dialog"), dialogPreview),
      h("div", { style: { display: "flex", flexDirection: "column", gap: "var(--space-3)" } }, this.colHead("Mobile < 768px \u00b7 bottom sheet"), sheetPreview),
      h("div", { style: { flex: 1, minWidth: 260, display: "flex", flexDirection: "column", gap: "var(--space-4)", paddingTop: "var(--space-6)" } },
        labelChip("01", "One shell, two frames. Content and controls are identical, only the frame changes with the viewport (per docs/overlays.md)."),
        labelChip("02", "Close X sits top-left; a settings cog top-right links to the full entity settings page."),
        labelChip("03", "Identity block: device-class icon, name, and an honest one-line state."),
        labelChip("04", "The control block is the archetype, brightness slider, dial, transport, and so on."),
        labelChip("05", "Below a hairline: History (a trend graph for sensors, a logbook for the rest), a collapsible Attributes list, and a link out to device settings.")));

    return h("div", { style: { minHeight: "100vh", background: "var(--color-bg)", color: "var(--color-text-primary)", fontFamily: "var(--font-body)", padding: "clamp(20px,4vw,56px)" } },
      h("div", { style: { maxWidth: 1180, margin: "0 auto", display: "flex", flexDirection: "column", gap: "var(--space-16)" } },
        h("header", { style: { display: "flex", flexDirection: "column", gap: "var(--space-4)" } },
          h("div", { style: { fontFamily: "var(--font-mono)", fontSize: "var(--text-xs)", letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-accent)" } }, "Concept Car \u00b7 more-info dialogs"),
          h("h1", { style: { margin: 0, fontFamily: "var(--font-display)", fontSize: "var(--text-3xl)", fontWeight: 600, letterSpacing: "-0.03em", lineHeight: 1.05 } }, "Entity dialogs, every archetype"),
          h("p", { style: { margin: 0, maxWidth: 680, fontSize: "var(--text-md)", color: "var(--color-text-secondary)", lineHeight: 1.55 } }, "The control panel you get when you tap an entity, the companion to the tile card. One shell renders as a centered dialog on desktop and a bottom sheet on mobile. The control block changes per archetype; every dialog closes with History and Attributes. Drag the sliders, spin the dials, tap through modes.")),
        this.sec("The shell", "One shell, two frames", "Header, identity, control, then history and attributes. The frame is the only thing the viewport changes.", anatomy),
        this.sec("The set", "Twenty-eight dialogs, one system", "Every Home Assistant domain, grouped by how it is controlled. Rich controls carry a bespoke widget; value entities lead with the number and history; helpers keep it to a single action or field. Each is live, shown here in its desktop dialog frame.", gallery),
        this.sec("In context", "Tap an entity, get the dialog", "The real overlay: a centered dialog on a wide screen, a bottom sheet on a narrow one. Resize the window across 768px to see it switch.", demoRoom),
        h("div", { style: { height: 1 } })),
      this.overlay());
  }

  renderVals() { return { app: this.buildApp() }; }
