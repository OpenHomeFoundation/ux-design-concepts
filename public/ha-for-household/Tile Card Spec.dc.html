        t({ key: "cl4", domain: "fan", name: "Bedroom fan", active: this.getOn("cl4", true), sub: this.getOn("cl4", true) ? this.getVal("clf4", 60) + "%" : "Off", onToggle: () => this.setOn("cl4", !this.getOn("cl4", true)), onInfo: true, feature: this.stack([this.iconGroup("clfm4", [{ v: "auto", icon: "autorenew" }, { v: "low", icon: "fan-speed-1" }, { v: "high", icon: "fan-speed-3" }, { v: "osc", icon: "arrow-oscillating" }, { v: "dir", icon: "arrow-u-left-top" }], "low", cFan), this.slider("clf4", 60, cFan, !this.getOn("cl4", true), () => this.setOn("cl4", true))]) }),

        t({ key: "cc3", domain: "thermostat", name: "Bedroom climate", active: true, value: "19.5\u00b0", sub: "Preset", onInfo: true, feature: this.dropdown("Eco", "leaf") }),
        t({ key: "cc4", domain: "humidifier", name: "Humidifier", active: this.getOn("cc4", true), sub: this.getOn("cc4", true) ? this.getVal("cch4", 45) + "%" : "Off", onToggle: () => this.setOn("cc4", !this.getOn("cc4", true)), onInfo: true, feature: this.stack([this.iconGroup("ccm4", [{ v: "auto", icon: "autorenew" }, { v: "baby", icon: "baby-carriage" }, { v: "eco", icon: "leaf" }], "auto"), this.stepper("cch4", 45)]) }),
        t({ key: "cc5", domain: "water_heater", name: "Water heater", active: true, sub: "Eco", onInfo: true, feature: this.iconGroup("ccw5", [{ v: "eco", icon: "leaf" }, { v: "perf", icon: "fire" }, { v: "off", icon: "power" }], "eco") }),

        t({ key: "cv2", domain: "blind", name: "Venetian blinds", active: true, sub: "Tilt " + this.getVal("cvt2", 45) + "%", onInfo: true, feature: this.slider("cvt2", 45, this.rawColor({ domain: "blind", active: true })) }),
        t({ key: "cv3", domain: "garage", name: "Garage door", active: this.getPick("cvg3", "up") === "up", sub: this.getPick("cvg3", "up") === "up" ? "Open" : "Closed", onInfo: true, feature: this.iconGroup("cvg3", [{ v: "up", icon: "arrow-up" }, { v: "stop", icon: "stop" }, { v: "down", icon: "arrow-down" }], "up") }),
        t({ key: "cv4", domain: "lock", name: "Front door", active: true, state: this.getPick("cvl4", "locked"), iconOn: this.getPick("cvl4", "locked") === "unlocked" ? "lock-open-variant" : "lock", sub: this.getPick("cvl4", "locked") === "unlocked" ? "Unlocked" : "Locked", onInfo: true, feature: this.stack([this.iconGroup("cvl4", [{ v: "locked", icon: "lock" }, { v: "unlocked", icon: "lock-open-variant" }], "locked"), this.pillButton("Open door", null, "od")]) }),
        t({ key: "cv5", domain: "valve", name: "Water valve", active: true, sub: this.getVal("cvv5", 100) + "% open", onInfo: true, feature: this.stack([this.iconGroup("cvvo5", [{ v: "open", icon: "valve-open" }, { v: "stop", icon: "stop" }, { v: "close", icon: "valve-closed" }], "open"), this.slider("cvv5", 100, this.DOM.valve.color)]) }),
      ]),
      grp("Media", [
        t({ key: "cm1", domain: "tv", name: "Living room TV", active: this.getOn("cm1", true), sub: this.getOn("cm1", true) ? "Netflix" : "Off", onToggle: () => this.setOn("cm1", !this.getOn("cm1", true)), onInfo: true, feature: this.stack([this.iconGroup("cmt1", [{ v: "prev", icon: "skip-previous" }, { v: "play", icon: "pause" }, { v: "next", icon: "skip-next" }], "play"), this.slider("cmv1", 35, this.DOM.tv.color)]) }),

        t({ key: "cs2", domain: "motion", name: "Hallway motion", active: true, sub: "Detected 2 min ago", onInfo: true }),
        t({ key: "cs3", domain: "door", name: "Front door sensor", active: false, sub: "Closed", onInfo: true }),

        t({ key: "cs6", domain: "battery", name: "Phone battery", active: true, sub: "Charging", onInfo: true, feature: this.barGauge("csb6", 72, "#2e9e5b") }),
        t({ key: "cs7", domain: "sun", name: "Sun", active: true, sub: "Above horizon", onInfo: true }),

      grp("Helpers and actions", [
        t({ key: "ch1", domain: "number", name: "Volume limit", active: true, sub: (this.getVal("ch1", 70) / 10).toFixed(0), onInfo: true, feature: this.stepper("ch1", 70) }),
        t({ key: "ch2", domain: "select", name: "Thermostat mode", active: true, sub: "Select", onInfo: true, feature: this.dropdown("Auto", "format-list-bulleted") }),
        t({ key: "ch3", domain: "scene", name: "Movie night", active: true, sub: "Scene", onInfo: true, feature: this.pillButton("Activate", null, "a") }),
        t({ key: "ch4", domain: "script", name: "Goodnight", active: true, sub: "Script", onInfo: true, feature: this.pillButton("Run", null, "r") }),

        t({ key: "ch7", domain: "update", name: "Home Assistant Core", active: true, sub: "Update available", onInfo: true, feature: this.row2([this.pillButton("Install", "#2f80ed", "i", true), this.pillButton("Skip", null, "s", true)]) }),

    return h("div", { style: { display: "flex", flexDirection: "column", gap: "var(--space-8)" } }, this.covChips(), ...groups);

  buildApp() {
    const h = React.createElement;
    return h("div", { style: { minHeight: "100vh", background: "var(--color-bg)", color: "var(--color-text-primary)", fontFamily: "var(--font-body)", padding: "clamp(20px,4vw,56px)" } },
      h("div", { style: { maxWidth: 1100, margin: "0 auto", display: "flex", flexDirection: "column", gap: "var(--space-16)" } },
        // hero
        h("header", { style: { display: "flex", flexDirection: "column", gap: "var(--space-4)" } },
          h("div", { style: { fontFamily: "var(--font-mono)", fontSize: "var(--text-xs)", letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--color-accent)" } }, "Concept Car \u00b7 tile card"),
          h("h1", { style: { margin: 0, fontFamily: "var(--font-display)", fontSize: "var(--text-3xl)", fontWeight: 600, letterSpacing: "-0.03em", lineHeight: 1.05 } }, "Tile card, flat and outline"),
          h("p", { style: { margin: 0, maxWidth: 640, fontSize: "var(--text-md)", color: "var(--color-text-secondary)", lineHeight: 1.55 } }, "Your Iteration 3 direction, built live in the dark theme. State reads from a flat/outline icon in a device-class color; on/off devices also tint the card. Tapping the icon toggles on and off, and the card body opens more-info. Sensors get a comfort band, and every domain has an honest Unavailable state."),
          this.headerBar()),
        this.sec("The model", "Every domain, three states", "Active shows a filled glyph; on/off domains (light, switch, fan, TV, speaker) add a soft tinted circle behind it because they can be turned off. Domains with no on/off (lock, garage, blind, vacuum, person) show the colored glyph alone. Inactive is an outline glyph; unavailable is muted with an info affordance.", this.matrix()),
        this.sec("Controls", "Tap the icon for on/off, feature row for the rest", "On/off devices (light, switch, fan, TV, speaker) toggle by tapping the icon and also carry a slider where it helps. Others have no on/off, so no tinted background: they get the right control instead, a target stepper, position slider, icon-button groups, a fan mode row, or a select. Every control is the same height. Drag and tap them.", this.controls()),
        this.sec("Sensors", "Read-only, with a comfort band", "Temperature and humidity have no on/off. They lead with the value, a qualitative band (Comfortable / Risky) with a matching sparkline, and a timestamp. Decision D4: keep this banding, or run sensors neutral.", this.sensors()),
        this.sec("Coverage", "Every domain and feature", "One preview per Home Assistant entity domain, built from the controls we have. Read-only entities (motion, door, smoke, sun, sensors) show state only; everything else carries its feature widget. The chips list the tile-card features (2025.9); trend graph is the sensor sparkline, and camera and weather forecast are parked.", this.coverage()),
        this.sec("Interaction", "Tap the icon, or tap the card", "", this.interaction()),
        this.sec("In context", "A room at the new density", "Mixed domains together, interactive. Toggle lights, step the thermostat, unlock the door, drag a slider, tap any card for more-info.", this.inContext()),
        h("div", { style: { height: 1 } })),
      this.infoDialog());
  }

  renderVals() { return { app: this.buildApp() }; }
}
