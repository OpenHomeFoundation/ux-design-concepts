  <script>
    /* Pre-paint theme resolver: stamp data-theme before first paint so the
       synced DS light/dark tokens apply with no flash. Instance default +
       per-user (per-persona) override, both in localStorage; falls back to OS. */
    (function () {
      try {
        var pid = sessionStorage.getItem("cc-persona") || "daan";
        var inst = localStorage.getItem("cc-theme-instance") || "system";
        var user = localStorage.getItem("cc-theme-" + pid) || (pid === "daan" ? "dark" : "default");
        var mode = user === "default" ? inst : user;
        var resolved = (mode === "light" || mode === "dark") ? mode
          : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", resolved);
        var a = {}; try { a = JSON.parse(localStorage.getItem("cc-a11y-" + pid) || "{}") || {}; } catch (e) {}
        if (a.contrast) document.documentElement.setAttribute("data-contrast", "high");
      } catch (e) {}
    })();
  </script>

      case "media": return 100;          // top whenever something is playing

      case "system-update": return 92;   // admin, when an update exists
      case "discovered": return 88;      // admin, new devices waiting to be set up
      case "repairs": return 84;         // admin, issues needing attention
      case "timer": return ctx.mediaPlaying ? 60 : 50; // a running timer, mid-stack
      case "whereis": return 52;         // steady mid-stack
      case "calendar": return ctx.minutesToNextEvent <= 120 ? 90 : 40;
      case "activity": return ctx.minutesSinceActivity <= 30 ? 85 : 25;
      case "weather": return 70;         // always near the top
      case "favorites": return 68;       // quick controls, high in the stack
      case "energy": return evening ? 75 : 45;

    const defOrder = this.fyDefaultFor(persona);
    const oi = (id) => { const i = defOrder.indexOf(id); return i < 0 ? 999 : i; };
    const byRelevance = (a, b) => { const d = this.fyScore(b, ctx) - this.fyScore(a, ctx); return d !== 0 ? d : oi(a) - oi(b); };

                  style: { padding: "var(--space-2) var(--space-4)", borderRadius: "var(--radius-full)", border: "1px solid " + (on ? "var(--color-accent)" : "var(--color-border)"), background: on ? "var(--color-accent)" : "transparent", color: on ? "#fff" : "var(--color-text-secondary)", cursor: "pointer", fontFamily: "var(--font-body)", fontSize: "var(--text-sm)", fontWeight: "var(--weight-medium)" } }, o); }))) : null));
    const config = cfgField ? h("div", { style: { display: "flex", flexDirection: "column", gap: "var(--space-5)", marginTop: "var(--space-5)" } }, cfgField) : null;
    const addBtn = h("button", { type: "button", onClick: () => isAdd ? this.fyAdd(wc.id) : close(),
      style: { width: "100%", height: 48, marginTop: "var(--space-6)", borderRadius: "var(--radius-md)", border: "none", background: "var(--color-accent)", color: "#fff", cursor: "pointer", fontFamily: "var(--font-body)", fontSize: "var(--text-base)", fontWeight: 600 } }, isAdd ? "Add widget" : "Done");
    const removeBtn = !isAdd ? h("button", { type: "button", onClick: () => this.fyRemove(wc.id),
      style: { width: "100%", height: 44, marginTop: "var(--space-2)", borderRadius: "var(--radius-md)", border: "none", background: "transparent", color: "var(--color-error)", cursor: "pointer", fontFamily: "var(--font-body)", fontSize: "var(--text-base)", fontWeight: "var(--weight-medium)" } }, "Remove widget") : null;
    const descEl = () => c.desc ? h("div", { style: { fontSize: "var(--text-sm)", color: "var(--color-text-secondary)", marginTop: "calc(var(--space-1) * -1)" } }, c.desc) : null;
    const card = h("div", { onClick: (e) => e.stopPropagation(), style: { width: bp === "mobile" ? "100%" : 480, maxWidth: "100%", maxHeight: "86vh", overflowY: "auto", background: "var(--color-surface)", borderRadius: "var(--radius-xl)", padding: "var(--space-6)" } },
      this.fyDialogHead(isAdd ? "Configure widget" : c.name, null, close, back),
      descEl(), config, addBtn, removeBtn);
    if (bp === "mobile") {
      return this.renderSheet({
        id: "widgetcfg", title: isAdd ? "Configure widget" : c.name, backdrop: true, dismissible: true, hideClose: true, noHeader: true,
        detents: [0.97], defaultDetent: 0, bg: "var(--color-surface)",
        bodyPad: "0 var(--space-5) var(--space-5)",
        rootBody: h("div", null, this.fyDialogHead(isAdd ? "Configure widget" : c.name, null, close, back), descEl(), config, addBtn, removeBtn),
      }, bp);
    }
    return this.fyScrim(bp, card, close);
  }

  renderVals() {
    return { app: this.buildApp() };
  }
}
</script>
</body>
</html>
