       synced DS light/dark tokens apply with no flash. */
    (function () {
      try {
        var resolved = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", resolved);
        var a = {}; try { a = JSON.parse(localStorage.getItem("cc-a11y-daan") || "{}") || {}; } catch (e) {}
        if (a.contrast) document.documentElement.setAttribute("data-contrast", "high");
      } catch (e) {}

class Component extends DCLogic {

    const pid = "daan";

      home: { name: "Abbey Road", units: "metric", tz: "Europe/Amsterdam", country: "NL" },

            : h("span", { style: { position: "absolute", right: -2, bottom: -2, width: 11, height: 11, borderRadius: "50%", border: "2px solid var(--color-surface)", background: item.presence === "home" ? "var(--color-success, #2e9e5b)" : "var(--color-text-tertiary)" } }));
    const meta = isZone
      ? (item.count != null ? (item.count === 1 ? "1 person" : item.count + " people") : "Zone")
      : hidden ? "Location hidden" : (item.updated ? item.at + " · " + item.updated : item.at);
    const swatches = null;
    if (hidden) {
      return h("div", { key: item.id,
        style: { display: "flex", alignItems: "center", gap: "var(--space-3)", width: "100%", textAlign: "left", padding: "var(--space-3) var(--space-3)", borderRadius: "var(--radius-md)" } },
        lead,
        h("span", { style: { minWidth: 0, flex: 1, display: "flex", flexDirection: "column" } },
          h("span", { style: { fontWeight: "var(--weight-medium)", fontSize: "var(--text-sm)", color: "var(--color-text-secondary)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" } }, item.name),
          h("span", { style: { fontSize: "var(--text-sm)", color: "var(--color-text-tertiary)" } }, meta)));
    }
    return h("button", { key: item.id, type: "button", onClick: () => this.mapRowTap(item, bp),
      style: { display: "flex", alignItems: "center", gap: "var(--space-3)", width: "100%", textAlign: "left", padding: "var(--space-3) var(--space-3)", borderRadius: "var(--radius-md)", border: "none", cursor: "pointer", background: active ? "var(--color-accent-subtle)" : "transparent", color: "var(--color-text-primary)", font: "inherit", transition: "background-color var(--duration-normal) var(--easing-out)" },
      onMouseEnter: (e) => { if (!active) e.currentTarget.style.background = "var(--color-surface-raised)"; },
      onMouseLeave: (e) => { if (!active) e.currentTarget.style.background = "transparent"; } },
      lead,
      h("span", { style: { minWidth: 0, flex: 1, display: "flex", flexDirection: "column" } },
        h("span", { style: { fontWeight: "var(--weight-medium)", fontSize: "var(--text-sm)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" } }, (!isZone && item.id === this.persona.id) ? "Me" : item.name),
        h("span", { style: { fontSize: "var(--text-sm)", color: active ? "var(--color-accent)" : "var(--color-text-secondary)" } }, meta)),
      swatches);
  }

  mapList(bp) {
    const h = React.createElement;
    const d = this.mod.mapData;
    const counts = {};
    d.people.forEach((p) => { if (p.zone) counts[p.zone] = (counts[p.zone] || 0) + 1; });
    const co = this.state.zoneColors || {}, no = this.state.zoneNames || {}, io = this.state.zoneIcons || {};
    const zones = d.zones.map((z) => Object.assign(this.mergedZone(z), { count: counts[z.id] || 0 }));
    // "Only you" (private) keeps the person in this list, but their row shows
    // that they've hidden their location, and they have no marker on the map.
    const cfgP = this.state.presenceCfg || {};
    const visOf = (p) => p.id === this.persona.id ? (cfgP.share === false ? "off" : (cfgP.people || "everyone")) : (p.visibility || "everyone");
    const visiblePeople = d.people.map((p) => {
      const v = visOf(p);
      if (p.id === this.persona.id) return p;
      if (v === "private") return Object.assign({}, p, { _hidden: true });
      if (v === "zones" && !p.zone) return Object.assign({}, p, { _hidden: true });
      return p;
    });
    const tab = this.state.mapTab || "people";
    const seg = (id, label) => h("button", { key: id, type: "button", className: "cc-toolbar__vbtn", "aria-pressed": tab === id, onClick: () => this.setState({ mapTab: id, mapFocus: null, mapDetail: null, notifyForm: null, notifyMenu: null }),
      style: { flex: 1, width: "auto", gap: "var(--space-2)", fontFamily: "var(--font-body)", fontSize: "var(--text-base)", fontWeight: "var(--weight-medium)" } },
      h("span", null, label));
    const segs = h("div", { style: { padding: "var(--space-2) 0 var(--space-1)" } },
      h("div", { className: "cc-toolbar__view", role: "group", "aria-label": "Show", style: { display: "flex", width: "100%", background: "var(--color-bg)" } },
        seg("people", "People"), seg("zones", "Zones")));
    const admin = this.persona.spaces.includes("admin");
    const rows = tab === "zones" ? zones.map((z) => this.mapListRow(z, bp)) : visiblePeople.map((p) => this.mapListRow(p, bp));
    // Last row of the zones list: adds a zone at the current map centre and drops
    // straight into the shape editor, so naming and placement happen in one flow.
    const addZoneBtn = (tab === "zones" && admin) ? h("button", { type: "button", onClick: () => this.addZone(bp),
      style: { display: "flex", alignItems: "center", gap: "var(--space-3)", width: "100%", textAlign: "left", padding: "var(--space-3) var(--space-3)", borderRadius: "var(--radius-md)", border: "none", cursor: "pointer", background: "transparent", color: "var(--color-accent)", font: "inherit", transition: "background-color var(--duration-normal) var(--easing-out)" },
      onMouseEnter: (e) => { e.currentTarget.style.background = "var(--color-surface-raised)"; },
      onMouseLeave: (e) => { e.currentTarget.style.background = "transparent"; } },
      h("span", { style: { width: 40, height: 40, flex: "none", borderRadius: "50%", border: "1px dashed var(--color-accent)", boxSizing: "border-box", display: "flex", alignItems: "center", justifyContent: "center" } }, h(this.C.Icon, { name: "plus", size: "md" })),
      h("span", { style: { fontWeight: "var(--weight-medium)", fontSize: "var(--text-sm)" } }, "Add zone")) : null;
    return h("div", { style: { display: "flex", flexDirection: "column", gap: 2 } }, h("div", { style: { display: "flex", flexDirection: "column", gap: 2 } }, rows), addZoneBtn);
  }

  // The map panel spec: list state carries the People / Zones segments in the
  // shared chrome; any detail / sub-step drops the segments and renders its own
  // sticky mapDetailHead inside the body. Routed through renderPanel like the
  // Automation and Dashboard panels.
  mapPanelSpec(bp) {
    const base = {
      id: "map", persistent: true, scrimAtMax: true, backdrop: false,
      detents: [0.4, 0.7, 0.97], defaultDetent: 0,
      bodyPad: "0 var(--space-4) var(--space-4)",
      desktopPos: { position: "absolute", top: "var(--space-4)", right: "var(--space-4)", maxHeight: "calc(100% - var(--space-8))" },
      desktopBodyPad: "0 var(--space-2) var(--space-3)",
    };
    if (this.state.mapDetail) {
      const body = this.mapDetailView(bp);
      if (body) return Object.assign(base, { body });
    }
    const tab = this.state.mapTab || "people";
    return Object.assign(base, {
      segments: { label: "Show", active: tab, items: [{ id: "people", label: "People" }, { id: "zones", label: "Zones" }],
        onChange: (id) => this.setState({ mapTab: id, mapFocus: null, mapDetail: null, notifyForm: null, notifyMenu: null }) },
      body: this.mapList(bp),
    });
  }

  mapBody(persona, bp) {
    const h = React.createElement;
    const d = this.mod.mapData;
    const co = this.state.zoneColors || {}, no = this.state.zoneNames || {}, io = this.state.zoneIcons || {};
    const md = Object.assign({}, d, { zones: d.zones.map((z) => this.mergedZone(z)) });
    // Per-person visibility governs the avatar on the map. The current persona's
    // setting comes live from presenceCfg; everyone else uses their stored value.
    //   everyone  -> always shown   homeaway -> shown only when home
    //   zones     -> shown only when in a named zone
    //   private   -> shown as a ghost (translucent)   (share off -> hidden)
    const cfgP = this.state.presenceCfg || {};
    const visOf = (p) => p.id === this.persona.id ? (cfgP.share === false ? "off" : (cfgP.people || "everyone")) : (p.visibility || "everyone");
    md.people = (d.people || []).map((p) => {
      const v = visOf(p);
      const isSelf = p.id === this.persona.id;
      if (v === "off") return null;
      // For the current persona, their own visibility setting changes how THEY
      // see themselves: when the condition isn't met they appear as a ghost
      // (translucent) rather than vanishing. For everyone else the same setting
      // hides them from this persona's map.
      if (v === "homeaway" && p.presence !== "home") return isSelf ? Object.assign({}, p, { ghost: true }) : null;
      if (v === "zones" && !p.zone) return isSelf ? Object.assign({}, p, { ghost: true }) : null;
      // "Only you" (private): visible to the person themselves (as a ghost),
      // hidden from everyone else.
      if (v === "private") return isSelf ? Object.assign({}, p, { ghost: true }) : null;
      return p;
    }).filter(Boolean);
    const markers = JSON.stringify(md);
    let editZone = "";
    if (this.state.zoneEdit) {
      const ez = (d.zones || []).find((x) => x.id === this.state.zoneEdit);
      if (ez) {
        const m = this.mergedZone(ez); const sh = (this.state.zoneShapes || {})[ez.id] || {};
        const mode = sh.mode || (m.polygon && m.polygon.length ? "polygon" : "circle");
        editZone = JSON.stringify({ id: ez.id, mode, lat: m.lat, lon: m.lon, radius: m.radius || 80, polygon: (m.polygon && m.polygon.length) ? m.polygon : null, color: m.color, icon: m.icon });
      }
    }
    let padBottom = 0;
    if (bp === "mobile" && this.state.mapDetail) {
      const detents = [0.4, 0.7, 0.97];
      const di = this.state.mapDetent || 0;
      padBottom = Math.round((this._mapWrapH || 0) * (detents[di] != null ? detents[di] : 0.4));
    }
    const mapEl = h("ha-world-map", {
      key: "worldmap",
      markers: markers,
      "edit-zone": editZone,
      "focus-id": this.state.mapFocus || "",
      "focus-pad-bottom": padBottom,
      "show-zones": (this.state.mapTab || "people") === "zones" ? "1" : "",
      theme: this.mapTheme(),
      ref: (el) => {
        this._worldMapEl = el;
        if (!el || el._wiredSelect) return;
        el._wiredSelect = true;
        el.addEventListener("marker-select", (e) => {
          const id = e.detail.id;
          const person = (this.mod.mapData.people || []).find((x) => x.id === id);
          if (person) this.mapRowTap(person, bp);
          else this.focusMapItem(id);
        });
        el.addEventListener("zone-change", (e) => {
          const dd = e.detail;
          this.setState((s) => { const next = Object.assign({}, s.zoneShapes); next[dd.id] = Object.assign({}, next[dd.id], { mode: dd.mode, lat: dd.lat, lon: dd.lon, radius: dd.radius, polygon: dd.polygon }); return { zoneShapes: next }; });
        });
      },
      style: { position: "absolute", inset: 0, isolation: "isolate" },
    });
    const overlay = this.ccPanel(this.mapPanelSpec(bp), bp);
    return h("div", { ref: (el) => { if (el) this._mapWrapH = el.clientHeight; }, style: { position: "relative", width: "100%", height: "100%", overflow: "hidden", background: "var(--color-surface-raised)" } }, mapEl, overlay);
  }

  // Confirmation dialog. Compact centered card on EVERY breakpoint (never a bottom
  // sheet), no X — you confirm or cancel. For destructive choices scrim-tap is
  // disabled so the decision is explicit. Open with askConfirm({...}).
  askConfirm(opts) { this.setState({ confirm: Object.assign({ confirmLabel: "Confirm", danger: false }, opts) }); }

  renderConfirm(bp) {
    const c = this.state.confirm; if (!c) return null;
    const h = React.createElement; const { Button } = this.C;
    const noAnim = this.reduceMotion();
    const cancel = () => this.setState({ confirm: null });
    const go = () => { this.setState({ confirm: null }); if (c.onConfirm) c.onConfirm(); };
    const card = h("div", { onClick: (e) => e.stopPropagation(), style: { width: bp === "mobile" ? "min(340px, 88vw)" : 360, maxWidth: "100%", background: "var(--color-overlay)", borderRadius: "var(--radius-xl)", padding: "var(--space-6)", display: "flex", flexDirection: "column", gap: "var(--space-4)", animation: noAnim ? "none" : "cc-dialog-in 200ms var(--easing-out)" } },
      h("div", { style: { display: "flex", flexDirection: "column", gap: "var(--space-2)" } },
        h("div", { style: { fontFamily: "var(--font-display)", fontSize: "var(--text-lg)", fontWeight: 700, letterSpacing: "-0.01em", color: "var(--color-text-primary)" } }, c.title),
        c.body ? h("div", { style: { fontSize: "var(--text-sm)", color: "var(--color-text-secondary)", lineHeight: 1.5 } }, c.body) : null),
      h("div", { style: { display: "flex", justifyContent: "flex-end", alignItems: "center", gap: "var(--space-2)" } },
        c.discardLabel ? h(Button, { variant: c.discardVariant || "danger", onClick: () => { this.setState({ confirm: null }); if (c.onDiscard) c.onDiscard(); } }, c.discardLabel) : null,
        c.discardLabel ? h("span", { style: { flex: 1 } }) : null,
        c.noCancel ? null : h(Button, { variant: "ghost", onClick: cancel }, c.cancelLabel || "Cancel"),
        h(Button, { variant: c.danger ? "danger" : "primary", onClick: go }, c.confirmLabel)));
    // Destructive confirmations cannot be dismissed by tapping the scrim.
    return h("div", { onClick: c.danger ? undefined : cancel, style: { position: "fixed", inset: 0, zIndex: 1000, display: "flex", alignItems: "center", justifyContent: "center", padding: "var(--space-6)", background: "var(--color-scrim)", animation: noAnim ? "none" : "cc-scrim-in 180ms ease" } }, card);
  }

  renderVals() {
    return { app: this.buildApp() };
  }
}
</script>
